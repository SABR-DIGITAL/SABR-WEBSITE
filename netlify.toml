[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/api/score"
  to = "/.netlify/functions/score"
  status = 200

# The web design studio used to live at the domain root. It has moved to
# /web-design so the new intro gateway can live at "/" instead — these keep
# previously-shared and previously-indexed links landing in the right place.
[[redirects]]
  from = "/projects"
  to = "/web-design/projects"
  status = 301
  force = true

[[redirects]]
  from = "/process"
  to = "/web-design/process"
  status = 301
  force = true

[[redirects]]
  from = "/faq"
  to = "/web-design/faq"
  status = 301
  force = true

[[redirects]]
  from = "/contact"
  to = "/web-design/contact"
  status = 301
  force = true

[[redirects]]
  from = "/demo/*"
  to = "/web-design/demo/:splat"
  status = 301
  force = true

# SPA fallback so every crawled URL resolves to the app shell
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Hashed build output is immutable — cache it hard for Core Web Vitals
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/documents/*"
  [headers.values]
    Content-Type = "application/pdf"
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

# Photography is not content-hashed, so cache for a week and revalidate in
# the background rather than marking it immutable.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
