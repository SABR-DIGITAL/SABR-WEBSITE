      :root {

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        /* Every entry point — the gateway, and the first viewport of either
           destination site's hero — paints dark. A white shell would flash
           between the gateway's panel-fill animation finishing and this
           site's own CSS/JS taking over, right when the hand-off needs to
           read as one continuous move. Matches the color-scheme meta tag
           above, which covers the moment before this stylesheet is even
           parsed. */
        background: #0A0D14;
        color-scheme: dark;
        color: var(--sabr-navy);
        font-family: 'Manrope', sans-serif;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        scroll-behavior: auto !important;
      }

      /* Only the root element's overflow propagates to the viewport, so this is
         where sideways scrolling gets stopped. `clip` is used in preference to
         `hidden` because `hidden` can leave the element behaving as a scroll
         container, and any scroll container above a `position: sticky` element
         silently stops it sticking; the `hidden` line is the fallback for
         browsers that predate `clip`. Deliberately NOT repeated on <body>,
         where it would create exactly that broken scroll container. */
      html {
        overflow-x: hidden;
        overflow-x: clip;
      }

      /* Layout Integrity: Refined for clarity and anti-crowding */
      h1, h2, h3 {

        overflow-wrap: normal;

      .text-shimmer-blue, .text-shimmer-emerald {
        background: linear-gradient(
          90deg, 
          #059669 0%, 
          #34d399 25%, 
          #ffffff 50%, 
          #6ee7b7 75%, 
          #059669 100%
        );
        background-size: 200% auto;
        color: #059669;
        background-clip: text;
        text-fill-color: transparent;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: emerald-shine 6s linear infinite;
      }

      @keyframes emerald-shine { to { background-position: 200% center; } }
      @keyframes blue-shine { to { background-position: 200% center; } }

        overflow-x: hidden;

    <script type="module">
      /* The soft background wash only ever shows on the web design studio:
         the gateway and the AI Optimisation site paint opaque backgrounds
         over it. So Three.js (and the WebGL context) is only fetched there,
         keeping those two pages light. */
      /* Exposed so the gateway can start it after handing over to the
         studio inside the same page (index.tsx) — there is no fresh page
         load for the path check below to see in that case. */
      let fluidStarted = false;
      window.__sabrStartFluidBg = () => {
        if (fluidStarted) return;
        fluidStarted = true;
        import('three').then((THREE) => {
        const canvas = document.getElementById('fluid-bg');
        const renderer = new THREE.WebGLRenderer({
          canvas,
          alpha: true,
          antialias: false,
          powerPreference: "high-performance",
          stencil: false,
          depth: false
        });
        /* This is a 15%-opacity pastel gradient with no detail in it, so there is
           nothing for extra device pixels to resolve. At devicePixelRatio 2 on a
           laptop screen it was pushing five million fragments a frame and handing
           the compositor a full-viewport layer to re-blend on every one of them,
           which is felt as scroll stutter across the whole site rather than as a
           slow background. */
        renderer.setPixelRatio(1);
        const scene = new THREE.Scene();
        const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const material = new THREE.ShaderMaterial({
          uniforms: { uTime: { value: 0 } },
          vertexShader: `varying vec2 vUv; void main() { vUv = uv; gl_Position = vec4(position, 1.0); }`,
          fragmentShader: `
            precision lowp float;
            uniform float uTime;
            varying vec2 vUv;
            void main() {
              vec2 uv = vUv;
              float t = uTime * 0.05;
              float wave = sin(uv.x * 1.5 + t) * cos(uv.y * 1.2 + t);
              vec3 c1 = vec3(0.99, 0.98, 0.97);
              vec3 c2 = vec3(0.92, 0.96, 1.0);
              vec3 color = mix(c1, c2, wave * 0.15 + 0.15);
              gl_FragColor = vec4(color, 1.0);
            }
          `
        });
        scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), material));
        let animationId;
        const stillOnly = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        /* The wave phase advances at 0.05 rad/s, so between two 60Hz frames it
           moves 0.0008 rad — nothing you can see. Drawing at 12fps looks identical
           and leaves the compositor free during scroll. */
        const FRAME_MS = 1000 / 12;
        let lastDraw = -Infinity;

        function draw(seconds) {
          material.uniforms.uTime.value = seconds;
          renderer.render(scene, camera);
        }

        function resize() {
          renderer.setSize(window.innerWidth, window.innerHeight, false);
          // Let the next animation frame through immediately so the new size is
          // painted without waiting out the throttle interval.
          lastDraw = -Infinity;
          if (stillOnly) draw(0);
        }
        window.addEventListener('resize', resize, { passive: true });
        resize();

        function animate(time) {
          animationId = requestAnimationFrame(animate);
          if (document.hidden) return;
          if (time - lastDraw < FRAME_MS) return;
          lastDraw = time;
          draw(time * 0.001);
        }

        if (!stillOnly) animate(0);
        });
      };
      if (location.pathname === '/web-design' || location.pathname.startsWith('/web-design/')) {
        window.__sabrStartFluidBg();
      }
    </script>
