      /* The soft background wash only ever shows on the web design studio:

      /* This used to pull in the whole of Three.js (about 160KB compressed,
         plus parse time on every studio page) to draw one full-screen quad
         with one fragment shader. It is the same quad, the same shader and
         the same output, drawn with the browser's own WebGL API instead. */
      /* Exposed so the gateway can start it after handing over to the
         studio inside the same page (index.tsx) — there is no fresh page
         load for the path check below to see in that case. */
      let fluidStarted = false;
      window.__sabrStartFluidBg = () => {
        if (fluidStarted) return;
        fluidStarted = true;
        if (window.innerWidth < 1024) return;
        const canvas = document.getElementById('fluid-bg');
        if (!canvas) return;
        const gl = canvas.getContext('webgl', {
          alpha: true,
          antialias: false,
          powerPreference: 'high-performance',
          stencil: false,
          depth: false
        });
        if (!gl) return;

        const compile = (type, source) => {
          const shader = gl.createShader(type);
          gl.shaderSource(shader, source);
          gl.compileShader(shader);
          return shader;
        };
        const program = gl.createProgram();
        gl.attachShader(
          program,
          compile(
            gl.VERTEX_SHADER,
            'attribute vec2 position; varying vec2 vUv;' +
              'void main() { vUv = position * 0.5 + 0.5; gl_Position = vec4(position, 0.0, 1.0); }'
          )
        );
        gl.attachShader(
          program,
          compile(
            gl.FRAGMENT_SHADER,
            `
            precision lowp float;
            uniform float uTime;
            varying vec2 vUv;
            void main() {
              vec2 uv = vUv;
              float t = uTime * 0.05;
              float wave = sin(uv.x * 1.5 + t) * cos(uv.y * 1.2 + t);
              vec3 c1 = vec3(0.99, 0.98, 0.97);
              vec3 c2 = vec3(0.92, 0.96, 1.0);
              vec3 color = mix(c1, c2, wave * 0.15 + 0.15);
              gl_FragColor = vec4(color, 1.0);
            }
          `
          )
        );
        gl.linkProgram(program);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) return;
        gl.useProgram(program);

        /* One quad covering clip space, so every pixel is written each draw
           and nothing needs clearing. */
        gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);

        gl.enableVertexAttribArray(position);
        gl.vertexAttribPointer(position, 2, gl.FLOAT, false, 0, 0);
        const uTime = gl.getUniformLocation(program, 'uTime');

        const FRAME_MS = 1000 / 12;

             compositor to re-blend on every one of them, felt as scroll stutter
             across the whole site. */
          canvas.width = window.innerWidth;
          canvas.height = window.innerHeight;
          gl.viewport(0, 0, canvas.width, canvas.height);

        }
